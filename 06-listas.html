<!-- 

  LISTAS

  nos ayudan a estructurar informacion ordenanda y no ordenada

  ordenadas llevam numeracion y la sintaxis es:

  <ol>...</ol>

  No ordenadas llevan bullets o viñetas y la sintaxis es:

  <ul>...</ul>

  para los elementos de lista se usa la sintaxis:

  <li>...</li>

  Existe el atributo "type" que permite cambiar el tipo de numeracion y bullet de una lista

  1    tipo numero
  a/A  tipo alfabetico
  i/I  tipo romano

  para las listas ordenandas los valores son:

  disc   balas o puntitos
  circle circulos
  square cuadros

-->
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Listas</title>
  </head>
  <body>
    <h1> Listas</h1>
    <p>Tenemos listas ordenadas y no ordenadas </p>

    <h2>Mi comida favorita</h2>
    <ol type="A">
        <li>hamburguesa</li>
        <li>cochinita</li>
        <li>camarones</li>
    </ol>

    <h2>Mis pokemones</h2>
    <ul type="circle">
        <li>lucario</li>
        <li>umbreon</li>
        <li>raykuaza</li>
    </ul>
  </body>
  </html>
