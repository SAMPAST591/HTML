<!-- 
 para colocar imagenes dentro de un html usamos la etiqueta:
 
 <img />

 esta estiqueta es de autocierre (self closing). En html 5 la / ya no es
 necesaria, pero se considera una buema practica utilizarla
 
 El atributo "src" (source u origen) le indica a la etiqueta la imagen a mostar. puede
 recibir una url exerterna o la ruta (path) interna.

 El atributo "alt" (alternative text o texto alternativo) es un texto que se mostrara en caso de que la 
 imagen no pueda ser renderizada por el navegador. Este atributo es obligatorio, por que se utiliza como apoyo en accesibilidad
 
 Los atributos width y heigth nos permite manipular el tamaño de las imagenes directamnte en html,aunque lo ideal es hacerlo en ssc

 -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
 </head>
 <body>
    <h1>Imagenes</h1>
    <p>Las imagenes nos permiten colocar elementos visuales en los sitios web</p>

    <h2>Imegen Externa</h2>
    <img src="https://picsum.photos/200/300" alt="imagen aleatoria desde lorem picsum.com"/>

    <h2>Imegen interna</h2>
    <img src="images/casco.jpg" alt="una persona con un casco medieval" width="300px" height="400"/>

 </body>
 </html>
